name: Code Coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format-check:
    uses: ./.github/workflows/format-check.yaml

  coverage:
    name: C++ Code Coverage
    needs: format-check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/funtides-sim/funtides/funtides-env:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install coverage tools
        run: |
          apt-get update
          apt-get install -y gcovr

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          CC=gcc-13 CXX=g++-13 cmake .. \
            -DCOMPILE_FD=ON \
            -DCOMPILE_SEM=ON \
            -DMAX_SOLVER_ORDER=3 \
            -DMAX_DIFFERENTIATOR_ORDER=3 \
            -DENABLE_PYWRAP=OFF \
            -DENABLE_COVERAGE=ON

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run Tests
        env:
          OMP_NUM_THREADS: 2
          KOKKOS_NUM_THREADS: 2
        run: |
          cd build
          ctest -LE "benchmark|validation" --output-on-failure

      - name: Generate Coverage Report
        run: |
          cd build
          mkdir -p coverage-report
          gcovr -r .. . \
            --html-details coverage-report/coverage.html \
            --xml coverage-report/coverage.xml \
            --exclude '.*/tests/.*' \
            --exclude '.*/_deps/.*' \
            --exclude '.*/tpl/.*' \
            -j $(nproc)

      - name: Parse Coverage XML for GitHub
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/coverage-report/coverage.xml
          badge: true
          format: markdown
          output: both
          indicators: true
          thresholds: '60 80'

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cxx-coverage-report
          path: build/coverage-report/
          retention-days: 14
