name: Format Check

on:
  workflow_call:

jobs:
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        path: ['src', 'tests']

    steps:
      - name: Run clang-format style check
        uses: jidicula/clang-format-action@v4.16.0
        with:
          clang-format-version: '18'
          check-path: ${{ matrix.path }}
